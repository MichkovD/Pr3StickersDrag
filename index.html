<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Стикерборд</title>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: #2c3e50;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    h1 {
      color: #ecf0f1;
      margin-bottom: 20px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: #ecf0f1;
      padding: 15px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      z-index: 10;
    }

    input {
      padding: 10px 15px;
      font-size: 16px;
      border: 2px solid #bdc3c7;
      border-radius: 8px;
      outline: none;
      width: 300px;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: #3498db;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: #3498db;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
    }

    button:hover { background: #2980b9; }
    button:active { transform: scale(0.95); }

    .main-container {
      display: flex;
      gap: 30px;
      width: 100%;
      max-width: 1200px;
      height: 75vh;
    }

    .zone-wrapper {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .zone-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ecf0f1;
      font-size: 18px;
      font-weight: bold;
      padding: 0 5px;
    }

    .clear-btn {
      background: #e74c3c;
      font-size: 14px;
      padding: 5px 10px;
      border-radius: 6px;
    }
    .clear-btn:hover { background: #c0392b; }

    .zone {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      flex: 1;
    }

    #pool {
      width: 300px;
      background-color: #34495e;
      border: 3px dashed #7f8c8d;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      overflow-y: auto;
    }

    #board {
      flex: 1;
      background-color: #d4a373;
      background-image:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1) 2px, transparent 2px),
        linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size: 100% 100%, 20px 20px, 20px 20px;
      border: 8px solid #8b5a2b;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
    }

    .sticker {
      position: absolute;
      width: 150px;
      height: 150px;
      padding: 15px;
      font-family: 'Comic Neue', cursive;
      color: #333;
      box-shadow: 3px 5px 15px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: grab;
      transition: box-shadow 0.1s;
      word-break: break-word;
      user-select: none;
    }

    .sticker:active {
      cursor: grabbing;
      box-shadow: 6px 10px 20px rgba(0,0,0,0.3);
      z-index: 1000;
    }

    #pool .sticker {
      position: relative;
      margin-bottom: -100px;
      transition: margin 0.2s, transform 0.2s;
    }

    #pool .sticker:hover {
      margin-bottom: 10px;
      z-index: 10;
    }

    .sticker-text {
      width: 100%;
      outline: none;
    }

    .delete-btn {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 24px;
      height: 24px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
    }

    .sticker:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      transform: scale(1.2);
      background: #c0392b;
    }

    .color-yellow { background: #fdfd96; }
    .color-blue { background: #a0c4ff; }
    .color-green { background: #b9fbc0; }
    .color-pink { background: #ffc6ff; }
    .color-orange { background: #ffd6a5; }

  </style>
</head>
<body>

<h1>📌 Стикерборд</h1>

<div class="controls">
  <input type="text" id="stickerInput" placeholder="Что нужно запомнить?">
  <button id="addBtn">Добавить</button>
</div>

<div class="main-container">

  <div class="zone-wrapper">
    <div class="zone-header">
      <span>Поле со стикерами</span>
      <button class="clear-btn" id="clearPool">Очистить</button>
    </div>
    <div class="zone" id="pool"></div>
  </div>

  <div class="zone-wrapper" style="flex: 1;">
    <div class="zone-header">
      <span>Борд</span>
      <button class="clear-btn" id="clearBoard">Очистить</button>
    </div>
    <div class="zone" id="board"></div>
  </div>

</div>

<script>
  const input = document.getElementById('stickerInput');
  const addBtn = document.getElementById('addBtn');
  const pool = document.getElementById('pool');
  const board = document.getElementById('board');
  const clearPool = document.getElementById('clearPool');
  const clearBoard = document.getElementById('clearBoard');

  const colors = ['color-yellow', 'color-blue', 'color-green', 'color-pink', 'color-orange'];
  let colorIndex = 0;
  let zIndexCounter = 10;

  function calculateFontSize(text) {
    const len = text.length;
    if (len < 10) return '28px';
    if (len < 20) return '22px';
    if (len < 35) return '18px';
    return '15px';
  }

  function applyRandomRotation(element) {
    const angle = Math.floor(Math.random() * 61) - 30;
    element.style.transform = `rotate(${angle}deg)`;
  }

  function addSticker() {
    const text = input.value.trim();
    if (text === '') return;

    const sticker = document.createElement('div');
    sticker.classList.add('sticker', colors[colorIndex % colors.length]);
    sticker.draggable = true;

    const span = document.createElement('div');
    span.classList.add('sticker-text');
    span.textContent = text;
    span.style.fontSize = calculateFontSize(text);
    span.contentEditable = "true";
    span.addEventListener('click', (e) => e.stopPropagation());

    const delBtn = document.createElement('button');
    delBtn.classList.add('delete-btn');
    delBtn.innerHTML = '×';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sticker.remove();
    });

    sticker.appendChild(span);
    sticker.appendChild(delBtn);

    applyRandomRotation(sticker);
    pool.appendChild(sticker);

    input.value = '';
    colorIndex++;
    updatePoolPositions();
  }

  addBtn.addEventListener('click', addSticker);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addSticker();
  });

  function updatePoolPositions() {
    const poolStickers = pool.querySelectorAll('.sticker');
    poolStickers.forEach((st, index) => {
      st.style.marginBottom = index === poolStickers.length - 1 ? '10px' : '-100px';
    });
  }

  let draggedSticker = null;
  let offsetX = 0;
  let offsetY = 0;

  document.addEventListener('dragstart', (e) => {
    if (e.target.classList.contains('sticker')) {
      draggedSticker = e.target;
      const rect = draggedSticker.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      setTimeout(() => draggedSticker.style.opacity = '0.5', 0);
      e.dataTransfer.effectAllowed = 'move';
    }
  });

  document.addEventListener('dragend', () => {
    if (draggedSticker) {
      draggedSticker.style.opacity = '1';
      draggedSticker = null;
      updatePoolPositions();
    }
  });

  board.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  });

  pool.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  });

  board.addEventListener('drop', (e) => {
    e.preventDefault();
    if (!draggedSticker) return;

    const boardRect = board.getBoundingClientRect();
    let x = e.clientX - boardRect.left - offsetX;
    let y = e.clientY - boardRect.top - offsetY;

    x = Math.max(0, Math.min(x, boardRect.width - 150));
    y = Math.max(0, Math.min(y, boardRect.height - 150));

    board.appendChild(draggedSticker);

    draggedSticker.style.position = 'absolute';
    draggedSticker.style.left = x + 'px';
    draggedSticker.style.top = y + 'px';
    draggedSticker.style.marginBottom = '0';
    draggedSticker.style.zIndex = zIndexCounter++;

    applyRandomRotation(draggedSticker);
    updatePoolPositions();
  });

  pool.addEventListener('drop', (e) => {
    e.preventDefault();
    if (!draggedSticker) return;

    pool.appendChild(draggedSticker);
    draggedSticker.style.position = 'relative';
    draggedSticker.style.left = 'auto';
    draggedSticker.style.top = 'auto';
    draggedSticker.style.zIndex = 'auto';

    applyRandomRotation(draggedSticker);
    updatePoolPositions();
  });

  clearPool.addEventListener('click', () => pool.innerHTML = '');
  clearBoard.addEventListener('click', () => board.innerHTML = '');

  let isDraggingMouse = false;
  let startX, startY, startLeft, startTop, activeSticker = null;

  board.addEventListener('mousedown', (e) => {
    const sticker = e.target.closest('.sticker');
    if (!sticker || e.target.classList.contains('delete-btn') || e.target.contentEditable === "true") return;

    isDraggingMouse = true;
    activeSticker = sticker;
    sticker.style.cursor = 'grabbing';

    startX = e.clientX;
    startY = e.clientY;

    const matchLeft = /translateX\(([-0-9.]+)px\)/.exec(sticker.style.transform);
    const matchTop = /translateY\(([-0-9.]+)px\)/.exec(sticker.style.transform);

    startLeft = parseFloat(sticker.style.left) || 0;
    startTop = parseFloat(sticker.style.top) || 0;

    sticker.style.zIndex = zIndexCounter++;
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDraggingMouse || !activeSticker) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    activeSticker.style.left = (startLeft + dx) + 'px';
    activeSticker.style.top = (startTop + dy) + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (activeSticker) {
      activeSticker.style.cursor = 'grab';
      activeSticker = null;
    }
    isDraggingMouse = false;
  });

</script>
</body>
</html>
